name: CI Verification

on:
  push:
    branches: [ solution ]
  pull_request:
    branches: [ solution ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Run Pytest
      run: uv run pytest tests/
